<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IndexedDB Tutorial - User Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <!-- Header -->
    <header class="bg-white shadow">
        <div class="max-w-6xl mx-auto px-4 py-6">
            <h1 class="text-3xl font-bold text-gray-900">User Manager</h1>
            <p class="text-gray-600 mt-1">IndexedDB Tutorial Application</p>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8">
        <!-- Create User Section -->
        <section class="bg-white rounded-lg shadow mb-8">
            <div class="p-6">
                <h2 class="text-2xl font-bold text-gray-900 mb-6">Add New User</h2>
                <form id="createForm" class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label for="name" class="block text-sm font-medium text-gray-700 mb-2">
                                Full Name
                            </label>
                            <input 
                                type="text" 
                                id="name" 
                                name="name" 
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none"
                                placeholder="John Doe"
                                required
                            >
                        </div>
                        <div>
                            <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
                                Email
                            </label>
                            <input 
                                type="email" 
                                id="email" 
                                name="email" 
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none"
                                placeholder="john@example.com"
                                required
                            >
                        </div>
                        <div>
                            <label for="role" class="block text-sm font-medium text-gray-700 mb-2">
                                Role
                            </label>
                            <input 
                                type="text" 
                                id="role" 
                                name="role" 
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none"
                                placeholder="Developer"
                                required
                            >
                        </div>
                        <div>
                            <label for="department" class="block text-sm font-medium text-gray-700 mb-2">
                                Department
                            </label>
                            <input 
                                type="text" 
                                id="department" 
                                name="department" 
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none"
                                placeholder="Engineering"
                                required
                            >
                        </div>
                    </div>
                    <button 
                        type="submit" 
                        class="w-full bg-blue-600 text-white py-2 px-4 rounded-lg hover:bg-blue-700 transition font-medium"
                    >
                        Create User
                    </button>
                </form>
            </div>
        </section>

        <!-- Search Section -->
        <section class="bg-white rounded-lg shadow mb-8">
            <div class="p-6">
                <h2 class="text-xl font-bold text-gray-900 mb-4">Search Users</h2>
                <div class="flex gap-4">
                    <input 
                        type="email" 
                        id="searchEmail" 
                        class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none"
                        placeholder="Search by email..."
                    >
                    <button 
                        id="searchBtn" 
                        class="bg-green-600 text-white py-2 px-6 rounded-lg hover:bg-green-700 transition font-medium"
                    >
                        Search
                    </button>
                    <button 
                        id="clearSearchBtn" 
                        class="bg-gray-500 text-white py-2 px-6 rounded-lg hover:bg-gray-600 transition font-medium"
                    >
                        Clear
                    </button>
                </div>
                <div id="searchResults" class="mt-4 hidden">
                    <p class="text-sm text-gray-600 mb-2">Search result:</p>
                    <div id="searchResultContent" class="bg-gray-50 p-4 rounded border border-gray-200"></div>
                </div>
            </div>
        </section>

        <!-- Users Display Section -->
        <section class="bg-white rounded-lg shadow">
            <div class="p-6">
                <h2 class="text-xl font-bold text-gray-900 mb-4">All Users</h2>
                <div id="usersList" class="space-y-3">
                    <p class="text-gray-500 text-center py-8">No users yet. Add one to get started!</p>
                </div>
            </div>
        </section>
    </main>

    <!-- Edit Modal -->
    <div id="editModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-lg shadow-xl max-w-md w-full mx-4">
            <div class="p-6">
                <h2 class="text-2xl font-bold text-gray-900 mb-6">Edit User</h2>
                <form id="editForm" class="space-y-4">
                    <input type="hidden" id="editUserId">
                    <div>
                        <label for="editName" class="block text-sm font-medium text-gray-700 mb-2">
                            Full Name
                        </label>
                        <input 
                            type="text" 
                            id="editName" 
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none"
                            required
                        >
                    </div>
                    <div>
                        <label for="editEmail" class="block text-sm font-medium text-gray-700 mb-2">
                            Email
                        </label>
                        <input 
                            type="email" 
                            id="editEmail" 
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none"
                            required
                        >
                    </div>
                    <div>
                        <label for="editRole" class="block text-sm font-medium text-gray-700 mb-2">
                            Role
                        </label>
                        <input 
                            type="text" 
                            id="editRole" 
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none"
                            required
                        >
                    </div>
                    <div>
                        <label for="editDepartment" class="block text-sm font-medium text-gray-700 mb-2">
                            Department
                        </label>
                        <input 
                            type="text" 
                            id="editDepartment" 
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none"
                            required
                        >
                    </div>
                    <div class="flex gap-3 pt-4">
                        <button 
                            type="submit" 
                            class="flex-1 bg-blue-600 text-white py-2 px-4 rounded-lg hover:bg-blue-700 transition font-medium"
                        >
                            Save
                        </button>
                        <button 
                            type="button" 
                            id="closeEditBtn"
                            class="flex-1 bg-gray-500 text-white py-2 px-4 rounded-lg hover:bg-gray-600 transition font-medium"
                        >
                            Cancel
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Notification -->
    <div id="notification" class="hidden fixed bottom-4 right-4 bg-green-600 text-white px-6 py-3 rounded-lg shadow-lg">
        Notification message
    </div>

    <script src="index.js"></script>
</body>
</html>
